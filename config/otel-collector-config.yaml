receivers:
  otlp:
    protocols:
      http:
        endpoint: localhost:4318
      grpc:
        endpoint: localhost:4317

processors:
  resourcedetection/gcp:
    detectors: [gcp, env]
    timeout: 2s
    override: false

  transform/cost:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["llm.cost.usd"], (attributes["llm.tokens.input"] * 0.00000125) + (attributes["llm.tokens.output"] * 0.000005)) where attributes["llm.tokens.input"] != nil

  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlphttp/dynatrace:
    endpoint: "https://roj78786.live.dynatrace.com/api/v2/otlp"
    headers:
      Authorization: "Api-Token ${DYNATRACE_API_TOKEN}"
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 100
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  file:
    path: ./output/traces.json
    rotation:
      max_megabytes: 10
      max_backups: 3
    format: json

service:
  telemetry:
    logs:
      level: info

  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection/gcp, transform/cost, batch]
      exporters: [otlphttp/dynatrace, debug, file]

    metrics:
      receivers: [otlp]
      processors: [resourcedetection/gcp, batch]
      exporters: [otlphttp/dynatrace, debug]

    logs:
      receivers: [otlp]
      processors: [resourcedetection/gcp, batch]
      exporters: [otlphttp/dynatrace, debug]
